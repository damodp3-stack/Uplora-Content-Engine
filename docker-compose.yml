version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: uplora-postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USERNAME:-uplora}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uplora_secret}
      POSTGRES_DB: ${DB_NAME:-uplora_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-uplora}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: uplora-redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
